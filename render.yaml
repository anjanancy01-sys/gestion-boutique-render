# Option rapide (facultative) : New > Blueprint sur Render. Le guide GUIDE_HEBERGEMENT.md explique la méthode manuelle, plus facile à corriger.
services:
  - type: web
    name: gestion-boutique
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed && gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-boutique-db
          property: connectionString

databases:
  - name: gestion-boutique-db
    plan: free
